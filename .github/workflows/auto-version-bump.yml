# Automatically bumps the patch version of @trycourier/courier-mcp after
# a Dependabot PR merges. The push (via REPO_TOKEN) triggers publish-npm.yml,
# which publishes the new version, which triggers bump-services.yml.
#
# Uses pull_request_target (not pull_request) because GitHub restricts
# pull_request events from Dependabot: no secret access, read-only perms.
# pull_request_target runs in the base branch context with full permissions.
name: Auto Version Bump

on:
  pull_request_target:
    types: [closed]
    paths:
      - 'mcp/package.json'

jobs:
  bump:
    name: Bump patch version
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bump patch version
        working-directory: mcp
        run: npm version patch --no-git-tag-version

      - name: Sync version to server.json
        run: |
          VERSION=$(jq -r '.version' mcp/package.json)
          jq --arg v "$VERSION" '.version = $v' server.json > server.json.tmp && mv server.json.tmp server.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=$(jq -r '.version' mcp/package.json)
          git add mcp/package.json mcp/package-lock.json server.json
          git commit -m "chore: bump @trycourier/courier-mcp to $VERSION [auto]"
          git push
